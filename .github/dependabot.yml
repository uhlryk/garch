# Dependabot proposes reviewed bumps: npm devDependencies (the package has no
# runtime dependencies) and the GitHub Actions, which are pinned by commit SHA.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    # a major TypeScript (7: the Go compiler) or Node types bump lands by hand,
    # with TypeDoc's support for it and dist/ compared before and after
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    commit-message:
      prefix: chore
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
