name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: the packed package loads from outside, CommonJS and ES module
        run: |
          npm pack
          mkdir -p ../consumer && cd ../consumer && npm init -y >/dev/null
          npm install ../garch/*.tgz
          node -e "const g = require('@krzysztofsztompka/garch'); require('@krzysztofsztompka/garch/node'); if (typeof g.fitGarch !== 'function') process.exit(1)"
          node --input-type=module -e "import { fitGarch } from '@krzysztofsztompka/garch'; import '@krzysztofsztompka/garch/node'; if (typeof fitGarch !== 'function') process.exit(1)"
