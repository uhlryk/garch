name: ci

on:
  push:
    branches: [main]
  pull_request:

# least privilege: CI reads the repository and nothing else
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run docs:check
      # TypeDoc fails on any export without a doc comment
      - run: npm run docs
      # Node 22.8+ reads coverage and holds it to the floors in package.json; Node 20 only tests
      - if: matrix.node == 20
        run: npm test
      - if: matrix.node != 20
        run: npm run coverage
      - name: the packed package loads from outside, CommonJS and ES module
        run: |
          npm pack
          mkdir -p ../consumer && cd ../consumer && npm init -y >/dev/null
          npm install ../garch/*.tgz
          node -e "const g = require('@krzysztofsztompka/garch'); require('@krzysztofsztompka/garch/node'); if (typeof g.fitGarch !== 'function') process.exit(1)"
          node --input-type=module -e "import { fitGarch } from '@krzysztofsztompka/garch'; import '@krzysztofsztompka/garch/node'; import { GarchWebPool } from '@krzysztofsztompka/garch/web'; if (typeof GarchWebPool !== 'function' || typeof fitGarch !== 'function') process.exit(1)"
      - name: the examples run against the packed package
        run: |
          cp -r examples ../consumer/examples
          cd ../consumer
          node examples/forecast.mjs
          node examples/var-backtest.mjs
          node examples/simulate-fan.mjs
