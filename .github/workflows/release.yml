name: release

# A pushed tag v<version> publishes that version to npm, with provenance, and
# makes a GitHub Release from its CHANGELOG.md section. The tag must match
# package.json's version.

on:
  push:
    tags: ['v*']

# nothing by default; the one job gets what publishing needs
permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub Release
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: the tag is package.json's version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json version ${version}"; exit 1
          fi
      - name: the changelog has a section for it
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## \\[" v "\\]" { f = 1; next }
            f && /^## \[/ { f = 0 }
            f && /^\[[^]]+\]: / { f = 0 }
            f
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}"; exit 1
          fi
      - run: npm ci
      # prepublishOnly runs the tests, prepack builds dist/
      # trusted publishing: npm exchanges the workflow's OIDC token, no secret
      - run: npm publish --provenance --access public
      - run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
